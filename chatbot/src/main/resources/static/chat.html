<!DOCTYPE html>
<html>
<head>
    <title>AI Customer Service Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        #chat-box {
            border: 1px solid #ddd;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }
        .message {
            margin: 10px 0;
            padding: 8px;
            border-radius: 5px;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            text-align: right;
        }
        .bot-message {
            background-color: #e9ecef;
            color: black;
        }
        #message-input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
        }
        #send-button {
            width: 18%;
            padding: 10px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
        #connection-status {
            padding: 5px;
            margin-bottom: 10px;
            text-align: center;
            border-radius: 3px;
        }
        .connected {
            background-color: #28a745;
            color: white;
        }
        .disconnected {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
<h1>AI Customer Service Chat</h1>
<div id="connection-status" class="disconnected">Disconnected</div>
<div id="chat-box"></div>
<input type="text" id="message-input" placeholder="Type your message..." />
<button id="send-button">Send</button>

<script>
    var stompClient = null;
    var chatBox = document.getElementById('chat-box');
    var messageInput = document.getElementById('message-input');
    var sendButton = document.getElementById('send-button');
    var statusDiv = document.getElementById('connection-status');

    function connect() {
        var socket = new SockJS('http://localhost:8080/ws-chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            console.log('Connected: ' + frame);
            statusDiv.textContent = 'Connected';
            statusDiv.className = 'connected';

            stompClient.subscribe('/topic/messages', function(message) {
                var chatMessage = JSON.parse(message.body);
                displayMessage(chatMessage.content, 'bot');
            });
        });
    }

    function sendMessage() {
        var messageContent = messageInput.value.trim();
        if (messageContent && stompClient) {
            var chatMessage = {
                sender: 'user',
                content: messageContent
            };

            // Display user message immediately
            displayMessage(messageContent, 'user');

            // Send to server
            stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));

            messageInput.value = '';
        }
    }

    function displayMessage(content, sender) {
        var messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + (sender === 'user' ? 'user-message' : 'bot-message');
        messageDiv.textContent = content;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Event listeners
    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Connect on page load
    connect();
</script>
</body>
</html>
